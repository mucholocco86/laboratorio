name: Wells Mic Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "Wells_Mic/android/**"
      - ".github/workflows/wells-mic-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Wells Mic debug APK
        working-directory: Wells_Mic/android
        run: gradle --no-daemon assembleDebug

      - name: Upload Wells Mic APK
        uses: actions/upload-artifact@v4
        with:
          name: Wells-Mic-v0.1-debug-apk
          path: Wells_Mic/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
